<style>

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;color:var(--chu);background:var(--nen);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;text-wrap:balance}
.an{display:none!important}
/* khung */
#khung{display:flex;flex-direction:column;min-height:100%}
.dau{background:var(--xanh);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}

.dau .tenCH{font-weight:700;line-height:1.2;flex:1;min-width:0}
.dau .tenCH{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dau .tenCH small{overflow:hidden;text-overflow:ellipsis;display:block;font-weight:400;opacity:.85;font-size:12px}
.dau button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:8px;padding:8px 10px}
.than{display:flex;flex:1;min-height:0}
.menu{display:none}
main{flex:1;min-width:0;padding:12px 12px 86px;max-width:980px;margin:0 auto;width:100%}
.day{position:fixed;left:0;right:0;bottom:0;background:var(--the);border-top:1px solid var(--vien);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.day button{flex:1;border:0;background:none;padding:9px 2px 8px;font-size:12px;color:var(--mo);display:flex;flex-direction:column;align-items:center;gap:2px}
.day button b{font-size:19px;font-weight:400;line-height:1}
.day button.chon{color:var(--xanh);font-weight:700}

  .menu button.chon{background:var(--xanhNhat);color:var(--xanh2);font-weight:700}
  .menu hr{border:0;border-top:1px solid var(--vien);margin:8px 4px}
  main{padding:18px 22px 40px}
}

.tieuDeTrang{display:flex;align-items:center;gap:8px;margin:2px 0 12px;flex-wrap:wrap}

.nut{border:1px solid var(--vien);background:var(--the);border-radius:9px;padding:10px 14px;min-height:42px}

label.o{display:block;margin-bottom:10px;font-size:13px;color:var(--mo)}

input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--xanh);outline-offset:1px}
.phai{text-align:right}
.so{font-variant-numeric:tabular-nums;white-space:nowrap}
.mo{color:var(--mo)}
.nho{font-size:13px}
.doChu{color:var(--do)}

.dam{font-weight:700}

.dong{padding:10px 0;border-bottom:1px solid #ecebe5}

.dong .tenH span{flex:1;overflow-wrap:anywhere}
.dong .tenH button{border:0;background:none;color:var(--do);font-size:18px;padding:0 4px;line-height:1}
.dong .dk{display:flex;align-items:center;gap:8px;margin-top:6px}

.tongKet input{width:150px;padding:8px 10px;border:1px solid #c9c7be;border-radius:9px;text-align:right;font-size:16px}
.kieuGiam{display:inline-flex;border:1px solid #c9c7be;border-radius:9px;overflow:hidden}
.kieuGiam button{border:0;background:#fff;padding:8px 10px;font-size:14px;min-width:44px}
.kieuGiam button.chon{background:var(--xanh);color:#fff;font-weight:700}
.tongKet .lon{font-size:19px;font-weight:700}
.luoi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}

table.bang{width:100%;border-collapse:collapse}
table.bang th,table.bang td{padding:8px 6px;border-bottom:1px solid #ecebe5;text-align:left;vertical-align:top}

.cuon{overflow-x:auto}

#hop .hd h3{flex:1;font-size:17px}
#hop .hd button{border:0;background:none;font-size:22px;line-height:1;padding:4px 8px}
#hop .nd{padding:14px 16px;overflow:auto}

#cho{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;background:linear-gradient(90deg,transparent,#ffd166,transparent);background-size:40% 100%;background-repeat:no-repeat;animation:chay 1s linear infinite}
@keyframes chay{from{background-position:-40% 0}to{background-position:140% 0}}
@media(prefers-reduced-motion:reduce){#cho{animation:none;background:#ffd166}}
.dn{max-width:380px;margin:8vh auto 0;padding:0 14px}
.dn h1{font-size:22px;color:var(--xanh2);text-align:center}
.dn p{text-align:center;color:var(--mo);margin:6px 0 18px}
/* phiếu in 80mm */
.phieu{width:72mm;max-width:100%;margin:0 auto;background:#fff;color:#000;font-family:"Times New Roman",Times,serif;font-size:12.5pt;line-height:1.35;padding:2mm 1mm}
.phieu .g{text-align:center}
.phieu .b{font-weight:700}
.phieu .n{font-size:10.5pt}
.phieu .td{font-size:16pt;font-weight:700;text-align:center;margin:3mm 0 1mm;letter-spacing:.3px}
.phieu table{width:100%;border-collapse:collapse}
.phieu .kh td{padding:1px 0;vertical-align:top}
.phieu .kh td:first-child{width:19mm;white-space:nowrap}
.phieu .hang{margin-top:2mm;border-top:1px solid #000}
.phieu .hang th{font-size:11pt;padding:1.2mm 0;border-bottom:1px solid #000;text-align:right}
.phieu .hang th:first-child{text-align:center}
.phieu .hang td{padding:.6mm 0;text-align:right;white-space:nowrap}
.phieu .hang tr.t td{text-align:left;font-weight:700;white-space:normal;overflow-wrap:anywhere;padding-top:1.2mm}
.phieu .hang tr.s td{border-bottom:1px dashed #000;padding-bottom:1.2mm}
.phieu .hang tr.s td:nth-child(1){width:34%}
.phieu .tg td{padding:.8mm 0;font-size:13pt}
.phieu .tg td:first-child{text-align:right;width:58%;padding-right:2mm;font-weight:700}
.phieu .tg td:last-child{text-align:right}
.phieu .tg.ql td:first-child{width:30%;white-space:nowrap}
.phieu .tg.ql td:last-child{text-align:left;font-weight:700}
.phieu .cuoi{border-top:1px dotted #000;margin-top:3mm;padding-top:2mm;text-align:center}
.xemPhieu{background:#e9e7df;border-radius:10px;padding:10px;overflow:auto}
.xemPhieu .phieu{box-shadow:0 1px 4px rgba(0,0,0,.2);padding:4mm 3mm;width:100%;max-width:440px;font-size:16px}
.xemPhieu .phieu .n{font-size:14px}.xemPhieu .phieu .td{font-size:21px}.xemPhieu .phieu .hang th{font-size:14px}.xemPhieu .phieu .tg td{font-size:17px}
.xemPhieu .phieu .kh td:first-child{width:76px}
#vungAnh{position:fixed;left:-10000px;top:0;width:420px;background:#fff}
#vungAnh .phieu{width:420px;max-width:none;font-size:18px;padding:18px 16px 22px}
#vungAnh .phieu .n{font-size:15px}#vungAnh .phieu .td{font-size:24px}#vungAnh .phieu .hang th{font-size:15px}#vungAnh .phieu .tg td{font-size:19px}
#vungAnh .phieu .kh td:first-child{width:84px}
#vungIn{display:none}
@page{margin:0}
@media print{
  html,body{height:auto;background:#fff}
  body>*{display:none!important}
  body>#vungIn{display:block!important}
  #vungIn .phieu{margin:0;padding:1mm 3mm 6mm}
}
</style>

/* ---------- tiện ích ---------- */

function so(v) { var am = /^\s*-/.test(String(v)); var s = String(v == null ? '' : v).replace(/\D/g, ''); var n = parseInt(s, 10) || 0; return am ? -n : n; }

function khop(chuoi, tuKhoa) { var c = boDau(chuoi), ok = true; boDau(tuKhoa).split(/\s+/).forEach(function (t) { if (t && c.indexOf(t) < 0) ok = false; }); return ok; }
function co(q) { return S.toi && (S.toi.laChu || S.toi.quyen.indexOf(q) >= 0); }
function hai(n) { return (n < 10 ? '0' : '') + n; }
function ngayGio(ms) { var d = new Date(ms); return hai(d.getDate()) + '/' + hai(d.getMonth() + 1) + '/' + String(d.getFullYear()).slice(2) + ' ' + hai(d.getHours()) + ':' + hai(d.getMinutes()); }
function gioPhieu(ms) { var d = new Date(ms), h = d.getHours(), ch = h >= 12, g = h % 12 || 12; return hai(d.getDate()) + '/' + hai(d.getMonth() + 1) + '/' + String(d.getFullYear()).slice(2) + ' - ' + g + ':' + hai(d.getMinutes()) + ':' + hai(d.getSeconds()) + (ch ? ' CH' : ' SA'); }
function ngayISO(d) { return d.getFullYear() + '-' + hai(d.getMonth() + 1) + '-' + hai(d.getDate()); }
function dinhDang(el) { var n = so(el.value); el.value = el.value.replace(/\D/g, '') === '' ? '' : tien(n); }
function luuTK(tk) { S.tk = tk; try { if (tk) localStorage.setItem('qlch_tk', tk); else localStorage.removeItem('qlch_tk'); } catch (e) {} }
function docTK() { try { return localStorage.getItem('qlch_tk'); } catch (e) { return null; } }
function hangCua(id) { for (var i = 0; i < S.hang.length; i++) if (S.hang[i].id === id) return S.hang[i]; return null; }
function khachCua(id) { for (var i = 0; i < S.khach.length; i++) if (S.khach[i].id === id) return S.khach[i]; return null; }

function bao(m, loi) {
  var b = $('#bao'); if (b) b.remove();
  b = document.createElement('div'); b.id = 'bao'; b.setAttribute('role', 'status'); if (loi) b.className = 'loi'; b.textContent = m;
  document.body.appendChild(b);
  setTimeout(function () { if (b.parentNode) b.remove(); }, loi ? 5000 : 2500);
}
function cho(bat) {
  dangGoi += bat ? 1 : -1; if (dangGoi < 0) dangGoi = 0;
  var c = $('#cho');

var CHI_DOC_KH = { trangThai: 1, khoiDong: 1, chiTietKhach: 1, dsHoaDon: 1, dsNhap: 1, dsDoiTac: 1, xemDoiTac: 1, doanhSoKhach: 1, baoCao: 1, dsNV: 1, nhatKy: 1 };

    document.body.appendChild(c);
    clearTimeout(_cheHen); _cheHen = setTimeout(function () { var t = $('#cheTB'); if (t) t.textContent = 'Mạng đang chậm, vẫn đang chờ… Thông tin đã nhập không bị mất.'; }, 8000);
  }
  if (!_che && c) { c.remove(); clearTimeout(_cheHen); }
}
function maMoi() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
function goi(viec, d) {
  var ghi = !CHI_DOC_KH[viec];
  return new Promise(function (ok, hong) {
    cho(true); if (ghi) che(true);
    var daXong = false, ac = window.AbortController ? new AbortController() : null;

      if (xong()) hong(new Error(ghi ? 'Máy chủ chưa phản hồi. Kiểm tra mạng rồi bấm lưu lại — thông tin đã nhập vẫn còn, và nếu lần trước đã lưu được thì web sẽ không tạo phiếu trùng.' : 'Máy chủ chưa phản hồi. Kiểm tra mạng rồi thử lại.'));

      body: JSON.stringify({ tk: S.tk || '', viec: viec, d: d || {} })
    }).then(function (res) {
      return res.text().then(function (t) {
        var r = null; try { r = JSON.parse(t); } catch (e) {}
        if (!res.ok) throw new Error('Máy chủ báo lỗi (' + res.status + ')' + (r && r.message ? ': ' + r.message : ''));

  if (!d) return;
  (d.hang || []).forEach(function (p) { var i = S.hang.findIndex(function (x) { return x.id === p.id; }); if (i >= 0) S.hang[i] = p; else S.hang.push(p); });

/* ---------- hộp thoại ---------- */
function moHop(tieuDe, nd, chan) {
  var cu = $('#hop');
  if (cu) { S.hopLui.push(cu.querySelector('.khoi').innerHTML); cu.remove(); } else ghiLichSu({ hop: 1 });
  var h = document.createElement('div'); h.id = 'hop';
  h.innerHTML = '<div class="khoi" role="dialog" aria-modal="true"><div class="hd"><button class="luiHop" onclick="quayLai()" aria-label="Quay lại">← Quay lại</button><h3>' + E(tieuDe) + '</h3><button onclick="dongHop()" aria-label="Đóng">×</button></div><div class="nd">' + nd + '</div>' + (chan ? '<div class="ch">' + chan + '</div>' : '') + '</div>';

function taiExcel() {

}

function xuatLichSuKhach(id) {

/* ====================== KHOẢNG THỜI GIAN ====================== */
function khoangHTML(ham) {
  var hn = ngayISO(new Date());
  return '<div class="the"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end"><label class="o" style="flex:1;min-width:130px;margin:0">Thời gian<select id="kgChon" onchange="doiKhoang();' + ham + '()"><option value="all">Toàn bộ thời gian</option><option value="hn">Hôm nay</option><option value="hq">Hôm qua</option><option value="7">7 ngày qua</option><option value="tn">Tháng này</option><option value="tt">Tháng trước</option><option value="nam">Năm nay</option><option value="tc">Tự chọn ngày…</option></select></label>' +
    '<label class="o" style="flex:1;min-width:130px;margin:0">Từ ngày<input type="date" id="kgTu" value="' + hn + '" onchange="$(\'#kgChon\').value=\'tc\';' + ham + '()"></label><label class="o" style="flex:1;min-width:130px;margin:0">Đến ngày<input type="date" id="kgDen" value="' + hn + '" onchange="$(\'#kgChon\').value=\'tc\';' + ham + '()"></label></div></div>';
}
function doiKhoang() {
  var c = $('#kgChon').value, a = new Date(), b = new Date();
  if (c === 'all') { $('#kgTu').value = ''; $('#kgDen').value = ''; return; }
  if (c === 'hq') { a.setDate(a.getDate() - 1); b = new Date(a); }
  else if (c === '7') a.setDate(a.getDate() - 6);
  else if (c === 'tn') a.setDate(1);
  else if (c === 'tt') { a = new Date(a.getFullYear(), a.getMonth() - 1, 1); b = new Date(b.getFullYear(), b.getMonth(), 0); }
  else if (c === 'nam') a = new Date(a.getFullYear(), 0, 1);
  else if (c === 'tc') return;
  $('#kgTu').value = ngayISO(a); $('#kgDen').value = ngayISO(b);
}
function khoang() {
  var a = $('#kgTu').value.split('-'), b = $('#kgDen').value.split('-');
  return { tu: a.length === 3 ? new Date(+a[0], a[1] - 1, +a[2], 0, 0, 0, 0).getTime() : 0, den: b.length === 3 ? new Date(+b[0], b[1] - 1, +b[2], 23, 59, 59, 999).getTime() : 0 };
}

function hienNV(r) {
  S.tam.nv = r.ds; if (S.trang !== 'nv') return;
  $('#dsNV').innerHTML = r.ds.map(function (x, i) { return '<li onclick="hopNV(' + i + ')"><div class="c1"><div class="dam">' + E(x.hoTen) + (x.laChu ? ' <span class="nhan">Chủ</span>' : '') + (x.biKhoa ? ' <span class="nhan do">đang khoá</span>' : '') + '</div><div class="nho mo">Tên đăng nhập: ' + E(x.tenDangNhap) + (x.laChu ? '' : ' · ' + x.quyen.length + ' quyền thêm') + '</div></div><span class="mo">›</span></li>'; }).join('');
}
function hopNV(i) {
  var x = i >= 0 ? S.tam.nv[i] : { id: 0, hoTen: '', tenDangNhap: '', quyen: [], laChu: false, biKhoa: false };
  var q = Object.keys(S.quyenDS).map(function (k) { return '<label><input type="checkbox" data-q="' + k + '" ' + (x.quyen.indexOf(k) >= 0 ? 'checked' : '') + '> ' + E(S.quyenDS[k]) + '</label>'; }).join('');
  moHop(x.id ? 'Sửa nhân viên' : 'Thêm nhân viên',
    '<label class="o">Họ tên<input id="nvHoTen" data-f value="' + E(x.hoTen) + '"></label><label class="o">Tên đăng nhập (chữ thường không dấu, ví dụ: lan)<input id="nvTen" autocapitalize="none" value="' + E(x.tenDangNhap) + '"' + (x.id ? ' disabled' : '') + '></label>' +
    '<label class="o">' + (x.id ? 'Đặt lại mật khẩu (để trống nếu không đổi)' : 'Mật khẩu (ít nhất 4 ký tự)') + '<input id="nvMK" autocomplete="new-password"></label>' +
    (x.laChu ? '<p class="mo">Tài khoản chủ luôn có toàn quyền.</p>' : '<div class="dam" style="margin:6px 0 2px">Quyền được cấp</div><div class="quyen">' + q + '</div>' + (x.id ? '<label style="display:flex;gap:10px;align-items:center;padding:12px 0 0" class="doChu"><input type="checkbox" id="nvKhoa" ' + (x.biKhoa ? 'checked' : '') + ' style="width:20px;height:20px"> Khoá tài khoản (nghỉ việc)</label>' : '')),
    '<button class="nut chinh" style="width:100%" onclick="luuNV(' + x.id + ')">Lưu</button>');
}
function luuNV(id) {
  var quyen = []; document.querySelectorAll('#hop [data-q]').forEach(function (c) { if (c.checked) quyen.push(c.getAttribute('data-q')); });
  goi('luuNV', { id: id, hoTen: $('#nvHoTen').value, tenDangNhap: $('#nvTen').value, matKhau: $('#nvMK').value, quyen: quyen, biKhoa: $('#nvKhoa') ? $('#nvKhoa').checked : false })
    .then(function (r) { if (r.tk) luuTK(r.tk); dongHop(); bao('Đã lưu nhân viên.'); hienNV(r); }).catch(loi);
}
function hopDoiMK() {
  moHop('Đổi mật khẩu', '<label class="o">Mật khẩu hiện tại<input id="mkCu" type="password" data-f autocomplete="current-password"></label><label class="o">Mật khẩu mới<input id="mkMoi" type="password" autocomplete="new-password"></label><label class="o">Nhập lại mật khẩu mới<input id="mkMoi2" type="password" autocomplete="new-password"></label>',
    '<button class="nut chinh" style="width:100%" onclick="doiMK()">Đổi mật khẩu</button>');
}
function doiMK() {
  if ($('#mkMoi').value !== $('#mkMoi2').value) return bao('Hai lần nhập mật khẩu mới không giống nhau.', true);
  goi('doiMatKhau', { cu: $('#mkCu').value, moi: $('#mkMoi').value }).then(function (r) { luuTK(r.tk); dongHop(); bao('Đã đổi mật khẩu.'); }).catch(loi);
}

/* ====================== CÀI ĐẶT / NHẬT KÝ ====================== */
function veCaiDat() {
  var c = S.cd;
  chinh('<div class="tieuDeTrang"><h2>Cài đặt cửa hàng</h2></div><div class="the"><div class="dam" style="margin-bottom:8px">Thông tin in trên phiếu</div>' +
    '<label class="o">Tên dòng 1<input id="cdT1" value="' + E(c.ten1) + '"></label><label class="o">Tên dòng 2<input id="cdT2" value="' + E(c.ten2) + '"></label><label class="o">Số điện thoại<input id="cdSdt" value="' + E(c.sdt) + '"></label><label class="o">Địa chỉ<input id="cdDC" value="' + E(c.diaChi) + '"></label><label class="o">Lời cảm ơn cuối phiếu (để trống nếu không in)<input id="cdCO" value="' + E(c.loiCamOn) + '"></label>' +
    '<label class="o">Cảnh báo sắp hết hàng khi tồn từ mức này trở xuống<input id="cdTT" inputmode="numeric" value="' + (c.tonToiThieu || 0) + '"></label>' +
    '<div class="hangNut"><button class="nut" onclick="xemPhieuMau()">Xem phiếu mẫu</button><button class="nut chinh" onclick="luuCaiDat()">Lưu</button></div></div>');
}
function luuCaiDat() {
  goi('luuCaiDat', { ten1: $('#cdT1').value, ten2: $('#cdT2').value, sdt: $('#cdSdt').value, diaChi: $('#cdDC').value, loiCamOn: $('#cdCO').value, tonToiThieu: so($('#cdTT').value) })
    .then(function (r) { S.cd = r.caiDat; bao('Đã lưu cài đặt.'); veKhung(); }).catch(loi);
}
function xemPhieuMau() {
  xemPhieu({ tieuDe: 'PHIẾU TÍNH TIỀN', thoiGian: Date.now(), khTen: 'Khách mẫu', khSdt: '0900000000', khDiaChi: 'Thôn 1', items: [{ ten: 'AMINO - TKA 1 LIT', sl: 1, gia: 300000 }, { ten: 'FULVIC RONG BIỂN', sl: 3, gia: 100000 }], giam: 0, tong: 600000, noCu: 0, tt: 600000, conNo: 0, nhanTT: 'Thanh toán' });
}
function veNhatKy() {
  chinh('<div class="tieuDeTrang"><h2>Nhật ký thao tác</h2></div><div class="the"><ul class="ds" id="dsNK"><li class="tinh mo">Đang tải…</li></ul></div>');
  goi('nhatKy').then(function (r) {
    if (S.trang !== 'nhatKy') return;
    $('#dsNK').innerHTML = r.ds.map(function (x) { return '<li class="tinh"><div class="c1"><div><b>' + E(x.hanhDong) + '</b> · ' + E(x.nhanVien) + '</div><div class="nho mo">' + ngayGio(x.thoiGian) + (x.chiTiet ? ' · ' + E(x.chiTiet) : '') + '</div></div></li>'; }).join('') || '<li class="tinh mo">Chưa có thao tác nào.</li>';
  }).catch(loi);
}

var _anLuc = 0;
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { _anLuc = Date.now(); return; }
  if (!_anLuc || Date.now() - _anLuc < 60000 || !S.toi) return;
  _anLuc = 0;
  if (_che) { _che = 0; var c = $('#che'); if (c) c.remove(); }
  dangGoi = 0; var b = $('#cho'); if (b) b.remove();
  taiDuLieu().catch(function () {});
});
batDau();
</script>
</body>
